<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Pro - Announcements Hub</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.85);
      --accent: #6366f1;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-light: rgba(255, 255, 255, 0.1);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: 16px; min-height: 100vh; padding-bottom: 40px; }
    header { font-size: 1.4rem; font-weight: 800; color: #818cf8; margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center; }
    .card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h2, h3, h4 { margin-bottom: 10px; }
    input, textarea, select { width: 100%; padding: 12px; margin-bottom: 10px; background: #0f172a; border: 1px solid var(--border-light); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    .btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-top: 4px; display: block; text-align: center; text-decoration: none; }
    .btn-secondary { background: transparent; border: 1px solid var(--border-light); }
    .badge { font-size:0.75rem; background:rgba(99,102,241,0.2); color:#818cf8; padding:4px 8px; border-radius:12px; font-weight:bold; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <span>📢 Broadcast Hub</span>
    <a href="index.html" class="btn btn-secondary" style="width:auto; padding:6px 12px; font-size:0.8rem;">← Back to App</a>
  </header>

  <main id="app">
    <div id="author-panel" class="card" style="border-color: #f59e0b; display:none;">
      <h3>➕ Post New Broadcast</h3>
      <input type="text" id="anc-title" placeholder="Announcement Title">
      <textarea id="anc-msg" placeholder="Announcement details, schedule info, or exam instructions..."></textarea>
      <select id="anc-priority">
        <option value="general">Priority: General Announcement 📢</option>
        <option value="urgent">Priority: Urgent Notice ⚡</option>
        <option value="schedule">Priority: Class/Exam Schedule 📅</option>
      </select>
      <button class="btn" style="background:#d97706;" onclick="postAnnouncement()">Publish Announcement</button>
    </div>

    <h3 style="margin: 16px 0 10px 0;">📋 Recent Announcements</h3>
    <div id="announcements-feed">Loading broadcasts...</div>
  </main>

  <script>
    const SUPABASE_URL = 'https://hizlhtxaypzgnizmjnqm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpemxodHhheXB6Z25pem1qbnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNTY5NzksImV4cCI6MjEwMDczMjk3OX0.HH9NaWUl5HSgzoy4w6W_57ylMRsIZS41LtGp7wM7V00';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let userRole = 'student';

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        currentUser = session.user;
        const { data } = await db.from('profiles').select('role').eq('id', currentUser.id).maybeSingle();
        if (data && data.role) userRole = data.role;
        
        if (userRole === 'admin' || userRole === 'teacher') {
          document.getElementById('author-panel').style.display = 'block';
        }
      }
      loadAnnouncements();
    }

    async function postAnnouncement() {
      const title = document.getElementById('anc-title').value;
      const message = document.getElementById('anc-msg').value;
      const priority = document.getElementById('anc-priority').value;

      if (!title || !message) { alert('Fill in both title and details.'); return; }

      const { error } = await db.from('announcements').insert([{ title, message, priority }]);
      if (error) {
        alert('Error: ' + error.message);
      } else {
        alert('Broadcast published!');
        document.getElementById('anc-title').value = '';
        document.getElementById('anc-msg').value = '';
        loadAnnouncements();
      }
    }

    async function loadAnnouncements() {
      const feed = document.getElementById('announcements-feed');
      const { data: list, error } = await db.from('announcements').select('*').order('created_at', { ascending: false });

      if (error) {
        feed.innerHTML = `<p style="color:#f87171;">Error loading announcements: ${error.message}</p>`;
        return;
      }

      if (!list || list.length === 0) {
        feed.innerHTML = `<p style="color:var(--text-sub); text-align:center;">No announcements posted yet.</p>`;
        return;
      }

      feed.innerHTML = list.map(a => `
        <div class="card" style="border-color: ${a.priority === 'urgent' ? '#f87171' : (a.priority === 'schedule' ? '#38bdf8' : 'rgba(99,102,241,0.3)')};">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <h4>${a.title}</h4>
            <span class="badge" style="background:${a.priority === 'urgent' ? 'rgba(248,113,113,0.2)' : 'rgba(99,102,241,0.2)'}; color:${a.priority === 'urgent' ? '#f87171' : '#818cf8'};">
              ${a.priority.toUpperCase()}
            </span>
          </div>
          <p style="color:var(--text-sub); font-size:0.9rem; line-height:1.4;">${a.message}</p>
          <span style="font-size:0.75rem; color:var(--text-sub); margin-top:10px; display:block;">
            📅 ${new Date(a.created_at).toLocaleDateString()}
          </span>
        </div>
      `).join('');
    }

    init();
  </script>
</body>
</html>
