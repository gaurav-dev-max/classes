<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Pro</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.85);
      --accent: #6366f1;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-light: rgba(255, 255, 255, 0.1);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: 16px; min-height: 100vh; padding-bottom: 80px; }
    header { font-size: 1.4rem; font-weight: 800; color: #818cf8; margin-bottom: 20px; text-align: center; display:flex; justify-content:space-between; align-items:center; }
    .card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h2, h3, h4 { margin-bottom: 10px; }
    input, textarea, select { width: 100%; padding: 12px; margin-bottom: 10px; background: #0f172a; border: 1px solid var(--border-light); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    .btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-top: 4px; display: block; text-align: center; }
    .btn-secondary { background: transparent; border: 1px solid var(--border-light); }
    .status-msg { margin-top: 10px; font-size: 0.85rem; text-align: center; color: #f87171; font-weight: bold; }
    .badge { font-size:0.75rem; background:rgba(99,102,241,0.2); color:#818cf8; padding:4px 8px; border-radius:12px; font-weight:bold; }
    .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 8px; overflow: hidden; margin: 10px 0; }
    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .opt-label { display: block; background: rgba(15,23,42,0.6); border: 1px solid var(--border-light); padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
    .opt-label:has(input:checked) { border-color: var(--accent); background: rgba(99,102,241,0.2); }

    /* Bottom Navigation Styling */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-sub);
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      flex: 1;
    }
    .nav-item.active {
      color: var(--accent);
      font-weight: bold;
    }
    .nav-icon {
      font-size: 1.2rem;
      margin-bottom: 2px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <span>⚡ LMS PRO</span>
    <span id="role-badge" class="badge">GUEST</span>
  </header>

  <main id="app">
    <div class="card" style="max-width:400px; margin: 0 auto;">
      <h2>Welcome Back</h2>
      <input type="email" id="email" placeholder="Email Address">
      <input type="password" id="password" placeholder="Password">
      <button class="btn" id="login-btn" onclick="login()">Login</button>
      <button class="btn btn-secondary" style="margin-top:8px;" onclick="signUp()">Create Student Account</button>
      <div id="status" class="status-msg"></div>
    </div>
  </main>

  <nav id="bottom-bar" class="bottom-nav" style="display: none;">
    <div class="nav-item active" id="nav-home" onclick="switchTab('home')">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </div>
    <div class="nav-item" id="nav-courses" onclick="switchTab('courses')">
      <span class="nav-icon">📚</span>
      <span>Courses</span>
    </div>
    <div class="nav-item" id="nav-doubts" onclick="switchTab('doubts')">
      <span class="nav-icon">💬</span>
      <span>Doubts</span>
    </div>
    <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </div>
  </nav>

  <script>
    const SUPABASE_URL = 'https://hizlhtxaypzgnizmjnqm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpemxodHhheXB6Z25pem1qbnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNTY5NzksImV4cCI6MjEwMDczMjk3OX0.HH9NaWUl5HSgzoy4w6W_57ylMRsIZS41LtGp7wM7V00';

    let db;
    let currentUser = null;
    let userRole = 'student';
    let currentTab = 'home';

    try {
      db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      alert('Initialization error: ' + e.message);
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const status = document.getElementById('status');
      const btn = document.getElementById('login-btn');

      if (!email || !password) {
        status.innerText = 'Please enter both email and password';
        return;
      }

      status.style.color = '#818cf8';
      status.innerText = 'Logging in...';
      btn.innerText = 'Authenticating...';
      btn.disabled = true;

      try {
        const { data, error } = await db.auth.signInWithPassword({ email, password });
        if (error) {
          status.style.color = '#f87171';
          status.innerText = error.message;
          btn.innerText = 'Login';
          btn.disabled = false;
        } else {
          currentUser = data.user;
          await fetchProfile();
          document.getElementById('bottom-bar').style.display = 'flex';
          switchTab('home');
        }
      } catch (err) {
        alert('Login Error: ' + err.message);
        btn.innerText = 'Login';
        btn.disabled = false;
      }
    }

    async function signUp() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const status = document.getElementById('status');

      if (!email || !password) {
        status.innerText = 'Please enter both email and password';
        return;
      }

      status.style.color = '#818cf8';
      status.innerText = 'Creating account...';

      try {
        const { data, error } = await db.auth.signUp({ email, password });
        if (error) {
          status.style.color = '#f87171';
          status.innerText = error.message;
        } else {
          if (data.user) {
            await db.from('profiles').upsert([{ id: data.user.id, full_name: email.split('@')[0], role: 'student' }]);
          }
          status.style.color = '#4ade80';
          status.innerText = 'Account registered! Tap Login now.';
        }
      } catch (err) {
        alert('SignUp Error: ' + err.message);
      }
    }

    async function fetchProfile() {
      if (!currentUser) return;
      try {
        const { data } = await db.from('profiles').select('role').eq('id', currentUser.id).maybeSingle();
        if (data && data.role) {
          userRole = data.role;
        } else {
          userRole = 'student';
        }
      } catch (e) {
        userRole = 'student';
      }
      document.getElementById('role-badge').innerText = userRole.toUpperCase();
    }

    function isStaff() { return userRole === 'admin' || userRole === 'teacher'; }

    function updateNavUI(activeTab) {
      currentTab = activeTab;
      ['home', 'courses', 'doubts', 'profile'].forEach(t => {
        const el = document.getElementById(`nav-${t}`);
        if (el) {
          if (t === activeTab) el.classList.add('active');
          else el.classList.remove('active');
        }
      });
    }

    function switchTab(tabName) {
      updateNavUI(tabName);
      if (tabName === 'home') renderHomeTab();
      else if (tabName === 'courses') renderCoursesTab();
      else if (tabName === 'doubts') renderDoubtsTab();
      else if (tabName === 'profile') renderProfileTab();
    }

    async function renderHomeTab() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="card">
          <h3>👋 Welcome, ${currentUser.email.split('@')[0]}</h3>
          <p style="color:var(--text-sub); font-size:0.85rem; margin-top:4px;">Role: <strong style="color:var(--accent);">${userRole.toUpperCase()}</strong></p>
        </div>

        ${userRole === 'admin' ? `
          <div class="card" style="border-color: #c084fc;">
            <h3>👥 Add New User Account</h3>
            <input type="text" id="new-user-name" placeholder="Full Name">
            <input type="email" id="new-user-email" placeholder="Email Address">
            <input type="password" id="new-user-pass" placeholder="Password">
            <select id="new-user-role">
              <option value="student">Role: Student</option>
              <option value="teacher">Role: Teacher</option>
              <option value="admin">Role: Admin</option>
            </select>
            <button class="btn" style="background:#a855f7;" onclick="adminCreateUser()">Create User</button>
          </div>
        ` : ''}

        <div class="card" style="border-color: rgba(99,102,241,0.4);">
          <h3>⚡ Quick Actions</h3>
          <button class="btn" onclick="switchTab('courses')">📚 Browse Courses</button>
          <button class="btn btn-secondary" style="margin-top:8px;" onclick="switchTab('doubts')">💬 Ask a Doubt</button>
        </div>
      `;
    }

    async function adminCreateUser() {
      const full_name = document.getElementById('new-user-name').value;
      const email = document.getElementById('new-user-email').value;
      const password = document.getElementById('new-user-pass').value;
      const role = document.getElementById('new-user-role').value;
      if (!full_name || !email || !password) { alert('Fill all fields'); return; }

      const tempClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
      const { data, error } = await tempClient.auth.signUp({ email, password });
      if (error) alert(error.message);
      else if (data.user) {
        await db.from('profiles').upsert([{ id: data.user.id, full_name: full_name, role: role }]);
        alert(`Created ${role.toUpperCase()} account for ${email}`);
      }
    }

    async function renderCoursesTab() {
      const app = document.getElementById('app');
      app.innerHTML = `
        ${userRole === 'admin' ? `
          <div class="card" style="border-color: var(--accent);">
            <h3>➕ Create Main Course</h3>
            <input type="text" id="course-title" placeholder="Course Title (e.g. CA Foundation)">
            <input type="text" id="course-desc" placeholder="Course Description">
            <button class="btn" onclick="addNewCourse()">Publish Course</button>
          </div>
        ` : ''}

        <h3>📚 Available Courses</h3>
        <div id="course-list" style="margin-top:10px;">Loading courses...</div>
      `;
      loadCourses();
    }

    async function loadCourses() {
      const list = document.getElementById('course-list');
      const { data: courses } = await db.from('courses').select('*');
      if (!courses || courses.length === 0) {
        list.innerHTML = `<p style="color:var(--text-sub); text-align:center;">No courses created yet.</p>`;
        return;
      }

      list.innerHTML = courses.map(c => `
        <div class="card">
          <h4>${c.title}</h4>
          <p style="color:var(--text-sub); font-size:0.85rem; margin-bottom:12px;">${c.description || ''}</p>
          <button class="btn btn-secondary" onclick="openSubjectsList('${c.id}', '${c.title}')">Open Subjects ➔</button>
        </div>
      `).join('');
    }

    async function addNewCourse() {
      const title = document.getElementById('course-title').value;
      const description = document.getElementById('course-desc').value;
      if (!title) { alert('Enter title'); return; }
      await db.from('courses').insert([{ title, description }]);
      loadCourses();
    }

    async function openSubjectsList(courseId, courseTitle) {
      const app = document.getElementById('app');
      const { data: teachers } = await db.from('profiles').select('id, full_name').eq('role', 'teacher');

      app.innerHTML = `
        <button class="btn btn-secondary" style="width:auto; padding:6px 12px; margin-bottom:12px;" onclick="renderCoursesTab()">← Back to Courses</button>
        <h2>${courseTitle}</h2>

        ${userRole === 'admin' ? `
          <div class="card" style="border-color: #38bdf8;">
            <h4>➕ Add Subject</h4>
            <input type="text" id="subj-title" placeholder="Subject Title">
            <input type="text" id="subj-level" placeholder="Level / Batch">
            <select id="subj-teacher">
              <option value="">Select Assigned Teacher</option>
              ${teachers ? teachers.map(t => `<option value="${t.id}">Teacher: ${t.full_name}</option>`).join('') : ''}
            </select>
            <button class="btn" style="background:#0284c7;" onclick="addSubject('${courseId}', '${courseTitle}')">Publish Subject</button>
          </div>
        ` : ''}

        <h3 style="margin-top:20px;">📚 Course Subjects</h3>
        <div id="subjects-list">Loading subjects...</div>
      `;

      loadSubjects(courseId, courseTitle);
    }

    async function addSubject(courseId, courseTitle) {
      const title = document.getElementById('subj-title').value;
      const level_name = document.getElementById('subj-level').value || 'General Level';
      const teacher_id = document.getElementById('subj-teacher').value || null;

      if (!title) { alert('Enter subject title'); return; }
      await db.from('subjects').insert([{ course_id: courseId, title, level_name, teacher_id }]);
      alert('Subject published!');
      openSubjectsList(courseId, courseTitle);
    }

    async function loadSubjects(courseId, courseTitle) {
      const list = document.getElementById('subjects-list');
      const { data: subjects } = await db.from('subjects').select('*, profiles(full_name)').eq('course_id', courseId);

      if (!subjects || subjects.length === 0) {
        list.innerHTML = `<p style="color:var(--text-sub); font-size:0.85rem;">No subjects added yet.</p>`;
        return;
      }

      list.innerHTML = subjects.map(s => `
        <div class="card" style="border-color: rgba(99,102,241,0.3);">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h4>${s.title}</h4>
            <span class="badge" style="background:rgba(56,189,248,0.2); color:#38bdf8;">${s.level_name}</span>
          </div>
          <p style="color:var(--text-sub); font-size:0.85rem; margin:6px 0 12px 0;">
            👨‍🏫 Teacher: <strong>${s.profiles ? s.profiles.full_name : 'Unassigned'}</strong>
          </p>
          <button class="btn" onclick="openSubjectChapters('${s.id}', '${s.title}', '${s.teacher_id}')">Open Chapters ➔</button>
        </div>
      `).join('');
    }

    async function openSubjectChapters(subjectId, subjectTitle, assignedTeacherId) {
      const app = document.getElementById('app');
      const canManage = (userRole === 'admin') || (userRole === 'teacher' && currentUser.id === assignedTeacherId);

      app.innerHTML = `
        <button class="btn btn-secondary" style="width:auto; padding:6px 12px; margin-bottom:12px;" onclick="renderCoursesTab()">← Back</button>
        <h2>📖 Subject: ${subjectTitle}</h2>

        ${canManage ? `
          <div class="card" style="border-color: #c084fc;">
            <h4>📌 Add New Chapter</h4>
            <input type="text" id="chap-title" placeholder="Chapter Title (e.g. Chapter 1: Introduction)">
            <button class="btn" style="background:#a855f7;" onclick="addChapter('${subjectId}', '${subjectTitle}', '${assignedTeacherId}')">Publish Chapter</button>
          </div>
        ` : ''}

        <h3 style="margin-top:20px;">📂 Chapters</h3>
        <div id="chapters-list">Loading chapters...</div>
      `;

      loadChapters(subjectId, canManage);
    }

    async function addChapter(subjectId, subjectTitle, assignedTeacherId) {
      const title = document.getElementById('chap-title').value;
      if (!title) { alert('Enter chapter title'); return; }
      await db.from('chapters').insert([{ subject_id: subjectId, title }]);
      openSubjectChapters(subjectId, subjectTitle, assignedTeacherId);
    }

    async function loadChapters(subjectId, canManage) {
      const { data: chapters } = await db.from('chapters').select('*').eq('subject_id', subjectId);
      const list = document.getElementById('chapters-list');

      if (!chapters || chapters.length === 0) {
        list.innerHTML = `<p style="color:var(--text-sub); font-size:0.85rem;">No chapters added yet.</p>`;
        return;
      }

      list.innerHTML = chapters.map(c => `
        <div class="card" style="border-color:rgba(192,132,252,0.3);">
          <h4>📌 ${c.title}</h4>
          <button class="btn btn-secondary" style="margin-top:8px;" onclick="openChapterContent('${c.id}', '${c.title}', ${canManage})">Open Chapter Content ➔</button>
        </div>
      `).join('');
    }

    // CHAPTER CONTENT (Lectures, Notes, Assignments, Quizzes)
    async function openChapterContent(chapterId, chapterTitle, canManage) {
      const app = document.getElementById('app');

      app.innerHTML = `
        <button class="btn btn-secondary" style="width:auto; padding:6px 12px; margin-bottom:12px;" onclick="renderCoursesTab()">← Back</button>
        <h2>📌 ${chapterTitle}</h2>

        ${canManage ? `
          <div class="card" style="border-color: var(--accent);">
            <h4>🎥 Add Video Lecture</h4>
            <input type="text" id="lec-title" placeholder="Lecture Title">
            <input type="text" id="lec-url" placeholder="YouTube Video URL">
            <button class="btn" onclick="addChapterLecture('${chapterId}', '${chapterTitle}', ${canManage})">Publish Lecture</button>
          </div>

          <div class="card" style="border-color: #38bdf8;">
            <h4>📄 Add Study Material / PDF Notes</h4>
            <input type="text" id="mat-title" placeholder="Material Title">
            <input type="text" id="mat-url" placeholder="Google Drive Link / PDF URL">
            <button class="btn" style="background:#0284c7;" onclick="addChapterMaterial('${chapterId}', '${chapterTitle}', ${canManage})">Publish Notes</button>
          </div>

          <div class="card" style="border-color: #f59e0b;">
            <h4>📝 Create Homework / Assignment</h4>
            <input type="text" id="ass-title" placeholder="Assignment Title">
            <textarea id="ass-desc" placeholder="Instructions / Questions"></textarea>
            <input type="text" id="ass-url" placeholder="Resource PDF / Link (Optional)">
            <button class="btn" style="background:#d97706;" onclick="addChapterAssignment('${chapterId}', '${chapterTitle}', ${canManage})">Publish Assignment</button>
          </div>

    <div class="card" style="border-color: #c084fc;">
            <h4>🧪 Create Chapter Quiz / Test</h4>
            <input type="text" id="test-title" placeholder="Test Title">
            <input type="text" id="test-q" placeholder="Question">
            <input type="text" id="opt-a" placeholder="Option A">
            <input type="text" id="opt-b" placeholder="Option B">
            <input type="text" id="opt-c" placeholder="Option C">
            <input type="text" id="opt-d" placeholder="Option D">
            <select id="correct-opt">
              <option value="A">Correct Option: A</option>
              <option value="B">Correct Option: B</option>
              <option value="C">Correct Option: C</option>
              <option value="D">Correct Option: D</option>
            </select>
            <button class="btn" style="background:#a855f7;" onclick="addChapterTest('${chapterId}', '${chapterTitle}', ${canManage})">Publish Quiz</button>
          </div>
        ` : ''}

        <h3 style="margin-top:20px;">🎥 Video Lectures</h3>
        <div id="chapter-lectures">Loading...</div>

        <h3 style="margin-top:20px;">📄 Notes & Study Materials</h3>
        <div id="chapter-materials">Loading...</div>

        <h3 style="margin-top:20px;">📝 Homework & Assignments</h3>
        <div id="chapter-assignments">Loading...</div>

        <h3 style="margin-top:20px;">🧪 Quizzes & Tests</h3>
        <div id="chapter-tests">Loading...</div>
      `;

      loadChapterData(chapterId, canManage);
    }

    async function loadChapterData(chapterId, canManage) {
      const { data: lectures } = await db.from('lectures').select('*').eq('chapter_id', chapterId);
      const { data: materials } = await db.from('study_materials').select('*').eq('chapter_id', chapterId);
      const { data: assignments } = await db.from('assignments').select('*').eq('chapter_id', chapterId);
      const { data: tests } = await db.from('tests').select('*').eq('chapter_id', chapterId);

      // Render Lectures
      const lecTarget = document.getElementById('chapter-lectures');
      lecTarget.innerHTML = (!lectures || lectures.length === 0)
        ? `<p style="color:var(--text-sub); font-size:0.85rem;">No video lectures in this chapter yet.</p>`
        : lectures.map(l => `
          <div class="card">
            <h4>${l.title}</h4>
            <div class="video-wrapper"><iframe src="${formatEmbedUrl(l.video_url)}" frameborder="0" allowfullscreen></iframe></div>
          </div>
        `).join('');

      // Render Materials
      const matTarget = document.getElementById('chapter-materials');
      matTarget.innerHTML = (!materials || materials.length === 0)
        ? `<p style="color:var(--text-sub); font-size:0.85rem;">No notes in this chapter yet.</p>`
        : materials.map(m => `
          <div class="card">
            <h4>${m.title}</h4>
            <a href="${m.file_url}" target="_blank" class="btn btn-secondary" style="display:block; text-align:center; text-decoration:none; margin-top:8px;">View Document 📄</a>
          </div>
        `).join('');

      // Render Assignments
      const assTarget = document.getElementById('chapter-assignments');
      assTarget.innerHTML = (!assignments || assignments.length === 0)
        ? `<p style="color:var(--text-sub); font-size:0.85rem;">No assignments posted yet.</p>`
        : assignments.map(a => `
          <div class="card" style="border-color:rgba(245,158,11,0.4);">
            <h4>📝 ${a.title}</h4>
            <p style="color:var(--text-sub); font-size:0.85rem; margin-bottom:10px;">${a.description || ''}</p>
            ${a.file_url ? `<a href="${a.file_url}" target="_blank" class="btn btn-secondary" style="display:block; text-align:center; text-decoration:none; margin-bottom:8px;">View Resource Document 📄</a>` : ''}

            ${userRole === 'student' ? `
              <div style="margin-top:10px; background:rgba(15,23,42,0.6); padding:10px; border-radius:8px;">
                <input type="text" id="sub-url-${a.id}" placeholder="Paste PDF / Google Drive / Solution link">
                <button class="btn" style="background:#d97706;" onclick="submitAssignment('${a.id}')">Submit Solution</button>
              </div>
            ` : ''}

            ${canManage ? `
              <button class="btn btn-secondary" style="margin-top:8px;" onclick="viewAssignmentSubmissions('${a.id}', '${a.title}')">Review Student Submissions 📥</button>
            ` : ''}
          </div>
        `).join('');

      // Render Tests
      const testTarget = document.getElementById('chapter-tests');
      testTarget.innerHTML = (!tests || tests.length === 0)
        ? `<p style="color:var(--text-sub); font-size:0.85rem;">No quizzes created for this chapter yet.</p>`
        : tests.map(t => `
          <div class="card" style="border-color:rgba(192,132,252,0.4);">
            <h4>🧪 ${t.title}</h4>
            <p style="margin:8px 0; font-size:0.95rem;"><strong>Q:</strong> ${t.question}</p>
            <label class="opt-label"><input type="radio" name="test-${t.id}" value="A"> A) ${t.option_a}</label>
            <label class="opt-label"><input type="radio" name="test-${t.id}" value="B"> B) ${t.option_b}</label>
            <label class="opt-label"><input type="radio" name="test-${t.id}" value="C"> C) ${t.option_c}</label>
            <label class="opt-label"><input type="radio" name="test-${t.id}" value="D"> D) ${t.option_d}</label>
            <button class="btn" style="background:#a855f7;" onclick="submitQuiz('${t.id}', '${t.correct_option}')">Submit Answer</button>
            <div id="quiz-res-${t.id}" style="margin-top:8px; font-weight:bold; text-align:center;"></div>
          </div>
        `).join('');
    }

    async function addChapterLecture(chapterId, chapterTitle, canManage) {
      const title = document.getElementById('lec-title').value;
      const video_url = document.getElementById('lec-url').value;
      if (!title || !video_url) { alert('Fill all fields'); return; }
      await db.from('lectures').insert([{ chapter_id: chapterId, title, video_url }]);
      openChapterContent(chapterId, chapterTitle, canManage);
    }

    async function addChapterMaterial(chapterId, chapterTitle, canManage) {
      const title = document.getElementById('mat-title').value;
      const file_url = document.getElementById('mat-url').value;
      if (!title || !file_url) { alert('Fill all fields'); return; }
      await db.from('study_materials').insert([{ chapter_id: chapterId, title, file_url }]);
      openChapterContent(chapterId, chapterTitle, canManage);
    }

    async function addChapterAssignment(chapterId, chapterTitle, canManage) {
      const title = document.getElementById('ass-title').value;
      const description = document.getElementById('ass-desc').value;
      const file_url = document.getElementById('ass-url').value;
      if (!title) { alert('Enter assignment title'); return; }
      await db.from('assignments').insert([{ chapter_id: chapterId, title, description, file_url }]);
      openChapterContent(chapterId, chapterTitle, canManage);
    }

    async function submitAssignment(assignmentId) {
      const file_url = document.getElementById(`sub-url-${assignmentId}`).value;
      if (!file_url) { alert('Please paste your solution link first.'); return; }

      await db.from('assignment_submissions').insert([{
        assignment_id: assignmentId,
        student_id: currentUser.id,
        file_url: file_url
      }]);

      alert('Assignment submitted successfully!');
    }

    async function viewAssignmentSubmissions(assignmentId, assignmentTitle) {
      const app = document.getElementById('app');
      const { data: subs } = await db.from('assignment_submissions')
        .select('*, profiles(full_name)')
        .eq('assignment_id', assignmentId);

      app.innerHTML = `
        <button class="btn btn-secondary" style="width:auto; padding:6px 12px; margin-bottom:12px;" onclick="renderCoursesTab()">← Back</button>
        <h2>📥 Submissions: ${assignmentTitle}</h2>
        <div id="subs-list" style="margin-top:10px;">Loading...</div>
      `;

      const list = document.getElementById('subs-list');
      if (!subs || subs.length === 0) {
        list.innerHTML = `<p style="color:var(--text-sub);">No student submissions recorded yet.</p>`;
        return;
      }

      list.innerHTML = subs.map(s => `
        <div class="card">
          <h4>👨‍🎓 Student: ${s.profiles ? s.profiles.full_name : 'Student'}</h4>
          <a href="${s.file_url}" target="_blank" class="btn btn-secondary" style="display:block; text-align:center; text-decoration:none; margin:8px 0;">View Submitted File 📄</a>
          <div style="margin-top:10px;">
            <input type="number" id="grade-${s.id}" placeholder="Marks (e.g. 90)" value="${s.marks_obtained || ''}">
            <input type="text" id="feedback-${s.id}" placeholder="Teacher Feedback" value="${s.feedback || ''}">
            <button class="btn" style="background:#10b981;" onclick="gradeSubmission('${s.id}')">Save Grade & Feedback</button>
          </div>
        </div>
      `).join('');
    }

    async function gradeSubmission(subId) {
      const marks = document.getElementById(`grade-${subId}`).value;
      const feedback = document.getElementById(`feedback-${subId}`).value;

      await db.from('assignment_submissions').update({
        marks_obtained: marks ? parseInt(marks) : null,
        feedback: feedback
      }).eq('id', subId);

      alert('Grade and feedback saved!');
    }

    async function addChapterTest(chapterId, chapterTitle, canManage) {
      const title = document.getElementById('test-title').value;
      const question = document.getElementById('test-q').value;
      const option_a = document.getElementById('opt-a').value;
      const option_b = document.getElementById('opt-b').value;
      const option_c = document.getElementById('opt-c').value;
      const option_d = document.getElementById('opt-d').value;
      const correct_option = document.getElementById('correct-opt').value;

      if (!title || !question || !option_a || !option_b) { alert('Fill required fields'); return; }

      await db.from('tests').insert([{
        chapter_id: chapterId,
        title, question, option_a, option_b, option_c, option_d, correct_option
      }]);

      alert('Chapter Quiz published!');
      openChapterContent(chapterId, chapterTitle, canManage);
    }

    function submitQuiz(testId, correctOption) {
      const selected = document.querySelector(`input[name="test-${testId}"]:checked`);
      const target = document.getElementById(`quiz-res-${testId}`);
      if (!selected) { alert('Please select an option first.'); return; }

      if (selected.value === correctOption) {
        target.style.color = '#4ade80';
        target.innerText = '✅ Correct Answer! Great job!';
      } else {
        target.style.color = '#f87171';
        target.innerText = `❌ Incorrect. The correct answer is Option ${correctOption}.`;
      }
    }

    async function renderDoubtsTab() {
      const app = document.getElementById('app');
      const { data: subjects } = await db.from('subjects').select('id, title');

      app.innerHTML = `
        <h2>💬 Doubts Portal</h2>
        ${userRole === 'student' ? `
          <div class="card" style="border-color: #10b981;">
            <h4>❓ Ask a New Doubt</h4>
            <select id="doubt-subject">
              <option value="">Select Subject</option>
              ${subjects ? subjects.map(s => `<option value="${s.id}">${s.title}</option>`).join('') : ''}
            </select>
            <textarea id="doubt-text" placeholder="Type your doubt or question details..."></textarea>
            <input type="text" id="doubt-img" placeholder="Photo Link / Image URL (Optional)">
            <button class="btn" style="background:#059669;" onclick="submitDoubt()">Submit Doubt</button>
          </div>
        ` : ''}

        <h3 style="margin-top:20px;">📋 Recent Doubts</h3>
        <div id="doubts-queue">Loading doubts...</div>
      `;

      loadDoubtsQueue();
    }

    async function submitDoubt() {
      const subject_id = document.getElementById('doubt-subject').value;
      const question_text = document.getElementById('doubt-text').value;
      const image_url = document.getElementById('doubt-img').value;

      if (!subject_id || !question_text)

{ alert('Please select a subject and type your question.'); return; }

      await db.from('doubts').insert([{
        student_id: currentUser.id,
        subject_id: subject_id,
        question_text: question_text,
        image_url: image_url || null
      }]);

      alert('Doubt submitted successfully!');
      renderDoubtsTab();
    }

    async function loadDoubtsQueue() {
      const queue = document.getElementById('doubts-queue');
      const { data: doubts } = await db.from('doubts')
        .select('*, subjects(title), profiles!student_id(full_name)')
        .order('created_at', { ascending: false });

      if (!doubts || doubts.length === 0) {
        queue.innerHTML = `<p style="color:var(--text-sub);">No doubts posted yet.</p>`;
        return;
      }

      queue.innerHTML = doubts.map(d => `
        <div class="card" style="border-color:${d.status === 'resolved' ? 'rgba(74,222,128,0.4)' : 'rgba(248,113,113,0.4)'};">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="badge" style="background:${d.status === 'resolved' ? 'rgba(74,222,128,0.2)' : 'rgba(248,113,113,0.2)'}; color:${d.status === 'resolved' ? '#4ade80' : '#f87171'};">
              ${d.status.toUpperCase()}
            </span>
            <span style="font-size:0.8rem; color:var(--text-sub);">${d.subjects ? d.subjects.title : 'General'}</span>
          </div>
          <p style="font-size:0.9rem; margin-bottom:8px;"><strong>${d.profiles ? d.profiles.full_name : 'Student'}:</strong> ${d.question_text}</p>
          ${d.image_url ? `<a href="${d.image_url}" target="_blank" class="btn btn-secondary" style="display:block; text-align:center; text-decoration:none; margin-bottom:8px;">View Question Photo 📷</a>` : ''}

          ${d.answer_text ? `
            <div style="background:rgba(15,23,42,0.8); border:1px solid var(--border-light); padding:12px; border-radius:8px; margin-top:8px;">
              <p style="font-size:0.85rem; color:#4ade80;"><strong>💡 Teacher Solution:</strong></p>
              <p style="font-size:0.9rem; margin-top:4px;">${d.answer_text}</p>
            </div>
          ` : ''}

          ${(isStaff() && d.status !== 'resolved') ? `
            <div style="margin-top:12px;">
              <textarea id="reply-${d.id}" placeholder="Type step-by-step solution here..."></textarea>
              <button class="btn" style="background:#059669;" onclick="resolveDoubt('${d.id}')">Submit Solution & Resolve</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    async function resolveDoubt(doubtId) {
      const answer_text = document.getElementById(`reply-${doubtId}`).value;
      if (!answer_text) { alert('Type a solution before submitting.'); return; }

      await db.from('doubts').update({
        answer_text: answer_text,
        status: 'resolved',
        answered_by: currentUser.id
      }).eq('id', doubtId);

      alert('Doubt resolved!');
      loadDoubtsQueue();
    }

    async function renderProfileTab() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="card">
          <h2>👤 Profile & Settings</h2>
          <p style="margin-top:8px;"><strong>Email:</strong> ${currentUser.email}</p>
          <p style="margin-top:4px;"><strong>Account Type:</strong> ${userRole.toUpperCase()}</p>
          <button class="btn btn-secondary" style="margin-top:16px; color:#f87171; border-color:#f87171;" onclick="location.reload()">Logout</button>
        </div>
      `;
    }

    function formatEmbedUrl(url) {
      if (url.includes('youtube.com/watch?v=')) return url.replace('watch?v=', 'embed/');
      if (url.includes('youtu.be/')) return url.replace('youtu.be/', 'youtube.com/embed/');
      return url;
    }
  </script>
</body>
</html>
