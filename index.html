<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Pro</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.85);
      --accent: #6366f1;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-light: rgba(255, 255, 255, 0.1);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: 16px; min-height: 100vh; padding-bottom: 60px; }
    header { font-size: 1.4rem; font-weight: 800; color: #818cf8; margin-bottom: 20px; text-align: center; display:flex; justify-content:space-between; align-items:center; }
    .card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h2, h3, h4 { margin-bottom: 10px; }
    input, textarea, select { width: 100%; padding: 12px; margin-bottom: 10px; background: #0f172a; border: 1px solid var(--border-light); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    .btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-top: 4px; }
    .btn-secondary { background: transparent; border: 1px solid var(--border-light); }
    .status-msg { margin-top: 10px; font-size: 0.85rem; text-align: center; color: #f87171; }
    .badge { font-size:0.75rem; background:rgba(99,102,241,0.2); color:#818cf8; padding:4px 8px; border-radius:12px; font-weight:bold; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <span>⚡ LMS PRO</span>
    <span id="role-badge" class="badge">GUEST</span>
  </header>

  <main id="app">
    <div class="card" style="max-width:400px; margin: 0 auto;">
      <h2>Welcome Back</h2>
      <input type="email" id="email" placeholder="Email Address">
      <input type="password" id="password" placeholder="Password">
      <button class="btn" id="login-btn" onclick="login()">Login</button>
      <button class="btn btn-secondary" style="margin-top:8px;" onclick="signUp()">Create Account</button>
      <div id="status" class="status-msg"></div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://hizlhtxaypzgnizmjnqm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpemxodHhheXB6Z25pem1qbnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNTY5NzksImV4cCI6MjEwMDczMjk3OX0.HH9NaWUl5HSgzoy4w6W_57ylMRsIZS41LtGp7wM7V00';

    let db;
    let currentUser = null;
    let userRole = 'student';

    try {
      db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      alert('Supabase Connection Error: ' + e.message);
    }

    async function login() {
      const emailInput = document.getElementById('email').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const status = document.getElementById('status');
      const loginBtn = document.getElementById('login-btn');
      
      if (!emailInput || !passwordInput) { 
        status.style.color = '#f87171';
        status.innerText = 'Please fill in both Email and Password fields'; 
        return; 
      }

      status.style.color = '#818cf8'; 
      status.innerText = 'Connecting to database...';
      loginBtn.innerText = 'Logging in...';
      loginBtn.disabled = true;

      try {
        const { data, error } = await db.auth.signInWithPassword({ 
          email: emailInput, 
          password: passwordInput 
        });

        if (error) { 
          status.style.color = '#f87171'; 
          status.innerText = error.message; 
          loginBtn.innerText = 'Login';
          loginBtn.disabled = false;
        } else { 
          currentUser = data.user;
          await fetchProfile();
          renderDashboard(); 
        }
      } catch (err) {
        alert('Unexpected Login Error: ' + err.message);
        loginBtn.innerText = 'Login';
        loginBtn.disabled = false;
      }
    }

    async function signUp() {
      const emailInput = document.getElementById('email').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const status = document.getElementById('status');
      
      if (!emailInput || !passwordInput) { 
        status.style.color = '#f87171';
        status.innerText = 'Please fill in both fields'; 
        return; 
      }

      status.style.color = '#818cf8'; 
      status.innerText = 'Creating account...';

      const { data, error } = await db.auth.signUp({ email: emailInput, password: passwordInput });
      if (error) { 
        status.style.color = '#f87171'; 
        status.innerText = error.message; 
      } else { 
        if (data.user) {
          await db.from('profiles').insert([{ id: data.user.id, full_name: emailInput.split('@')[0], role: 'student' }]);
        }
        status.style.color = '#4ade80'; 
        status.innerText = 'Account created! Tap Login now.'; 
      }
    }

    async function fetchProfile() {
      if (!currentUser) return;
      const { data } = await db.from('profiles').select('role').eq('id', currentUser.id).single();
      if (data) { 
        userRole = data.role; 
        document.getElementById('role-badge').innerText = userRole.toUpperCase();
      }
    }

    async function renderDashboard() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Welcome, ${currentUser.email.split('@')[0]}</h3>
            <button class="btn btn-secondary" style="width:auto; padding:4px 10px; font-size:0.8rem;" onclick="location.reload()">Logout</button>
          </div>
        </div>
        <div class="card" style="text-align:center;">
          <h2 style="color:#4ade80;">🎉 Logged In Successfully!</h2>
          <p style="color:var(--text-sub); margin-top:8px;">User Role: <strong>${userRole.toUpperCase()}</strong></p>
        </div>
      `;
    }
  </script>
</body>
</html>
